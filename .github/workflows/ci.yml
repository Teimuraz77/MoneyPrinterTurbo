name: CI

on:
  pull_request:
  push:
    branches: [main, wwnn-pipeline]

jobs:
  tests:
    name: Python ${{ matrix.python-version }} (CPU, mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (libass) and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install package
        run: pip install -e ".[bot,upload,dev]"
      - name: Lint
        run: ruff check wwnn tests
      - name: Unit + dry-run tests
        run: python -m pytest -q
