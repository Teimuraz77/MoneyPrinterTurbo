[project]
name = "wwnn"
version = "0.1.0"
description = "WWNN - Worldwide Weekly Nonsense News: local-first weekly AI news-satire pipeline (fork of MoneyPrinterTurbo)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "loguru>=0.7,<0.8",
  "requests>=2.31,<3",
  "numpy>=1.24",
  "pillow>=10",
  "feedparser>=6.0.11,<7",
]

[project.optional-dependencies]
bot = ["python-telegram-bot>=22.0,<23"]
upload = ["google-api-python-client>=2.100,<3", "google-auth-oauthlib>=1.2,<2", "google-auth>=2.20,<3"]
whisper = ["faster-whisper==1.1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wwnn = "wwnn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wwnn*", "app*"]

[tool.setuptools.package-data]
wwnn = ["script/prompts/*.md", "db/migrations/*.sql", "db/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders real video with ffmpeg (seconds to a minute)"]

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["tests/fixtures", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "I001"]
